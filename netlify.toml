[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # GEMINI_MODEL is a public model identifier, not a credential.
  # Keep scanning enabled for GEMINI_API_KEY and all other secrets.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/intent"
  to = "/.netlify/functions/intent"
  status = 200
  force = true

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200
  force = true

[[redirects]]
  from = "/api/lens"
  to = "/.netlify/functions/lens"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
