[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # GEMINI_MODEL is a public model name (e.g. "gemini-3.8-flash") that legitimately
  # appears in source and docs; GEMINI_API_KEY stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/intent"
  to = "/.netlify/functions/intent"
  status = 200
  force = true

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200
  force = true

[[redirects]]
  from = "/api/lens"
  to = "/.netlify/functions/lens"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
