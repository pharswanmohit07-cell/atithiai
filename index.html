<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18231F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Explore Jaipur, Ubud and Lisbon with destination-based place discovery, food suggestions, and editable one-day travel plans." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Atithi AI | Travel planning for Jaipur, Ubud and Lisbon</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("atithi-theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          var prefersDark = typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (meta) {
            var isDarkTheme = meta.media.includes("dark");
            meta.setAttribute("content", isDarkTheme ? "#18231F" : "#F7F6F1");
            meta.media = isDarkTheme === dark ? "all" : "(prefers-color-scheme: never)";
          });
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
