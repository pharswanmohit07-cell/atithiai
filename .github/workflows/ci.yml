name: Atithi AI CI

on:
  push:
    branches:
      - main
      - fix/nav-layout-and-images
      - launch/polished-travel-brand
      - feature/mentor-feedback
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-runtime:
    name: Install, lint, unit tests, assets, build and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run pure library unit checks
        run: npm run test:lib
      - name: Check required site icons
        run: npm run check:images
      - name: Run ESLint and source checks
        run: npm run lint
      - name: Build production assets
        run: npm run build
      - name: Install temporary browser-test tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Run browser runtime smoke matrix
        run: npm run test:runtime
