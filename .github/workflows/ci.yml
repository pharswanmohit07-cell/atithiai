name: Atithi AI CI

on:
  push:
    branches:
      - feature/guest-onboarding
  pull_request:
    branches:
      - feature/dark-mode

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
